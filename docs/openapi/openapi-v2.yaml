openapi: 3.1.0
info:
  title: CircleHaven — Trust Circle API v2 (E2EE X25519/Ed25519)
  version: "2.0.0"
servers:
  - url: https://trust-circle.kavalek.fr
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA/Ed25519 uniquement, audience trust-circle-api et typ=access.
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Refresh token uniquement, audience trust-circle-auth et typ=refresh.
  schemas:
    DeviceKey:
      type: object
      required: [userId, deviceId, pk_sig, pk_kem, key_version, status]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string }
        pk_sig: { type: string, description: Base64(32B) }
        pk_kem: { type: string, description: Base64(32B) }
        key_version: { type: integer }
        status: { type: string, enum: [active, revoked] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }

    AccountDevice:
      type: object
      required: [deviceId, identityPublicKey, identityKeyVersion, platform, deviceName, status, proofVerifiedAt, activatedAt, revokedAt, createdAt, updatedAt]
      properties:
        deviceId: { type: string, format: uuid }
        identityPublicKey: { type: string, description: Base64 canonique de la clé Ed25519 brute de 32 octets }
        identityKeyVersion: { type: integer, minimum: 1 }
        platform: { type: string, enum: [android, ios, windows, macos, unknown] }
        deviceName: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [pending, active, revoked] }
        proofVerifiedAt: { type: string, format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeviceRegistrationChallenge:
      type: object
      required: [challengeId, deviceId, challenge, transcript, expiresAt, algorithm]
      properties:
        challengeId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        challenge: { type: string, description: Base64 canonique du nonce CSPRNG de 32 octets }
        transcript: { type: string, description: Base64 des 163 octets exacts à signer }
        expiresAt: { type: string, format: date-time }
        algorithm: { type: string, enum: [Ed25519] }

    DeviceApprovalChallenge:
      type: object
      required: [challengeId, approverDeviceId, targetDeviceId, decision, transcript, expiresAt, algorithm, target]
      properties:
        challengeId: { type: string, format: uuid }
        approverDeviceId: { type: string, format: uuid }
        targetDeviceId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        transcript: { type: string, description: Base64 des 216 octets exacts à signer }
        expiresAt: { type: string, format: date-time }
        algorithm: { type: string, enum: [Ed25519] }
        target:
          type: object
          required: [deviceId, identityPublicKey, identityKeyVersion, platform, deviceName]
          properties:
            deviceId: { type: string, format: uuid }
            identityPublicKey: { type: string, description: Base64 canonique de la clé Ed25519 brute de 32 octets }
            identityKeyVersion: { type: integer, minimum: 1 }
            platform: { type: string, enum: [android, ios, windows, macos, unknown] }
            deviceName: { type: string }

    RecipientWrap:
      type: object
      required: [userId, deviceId, wrap, nonce]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string }
        wrap: { type: string, description: Base64(AES-GCM wrap of mk) }
        nonce: { type: string, description: Base64(12B) }

    MessageV2:
      type: object
      required: [v, alg, groupId, convId, messageId, sentAt, sender, recipients, iv, ciphertext, sig]
      properties:
        v: { type: integer, enum: [2] }
        alg:
          type: object
          properties:
            kem: { type: string, enum: [X25519] }
            kdf: { type: string, enum: [HKDF-SHA256] }
            aead: { type: string, enum: [AES-256-GCM] }
            sig: { type: string, enum: [Ed25519] }
        groupId: { type: string, format: uuid }
        convId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        sender:
          type: object
          required: [userId, deviceId, eph_pub, key_version]
          properties:
            userId:
              type: string
              format: uuid
              description: Doit correspondre au sujet du bearer access token ; toute divergence est refusée.
            deviceId: { type: string }
            eph_pub: { type: string, description: Base64(32B X25519) }
            key_version: { type: integer }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/RecipientWrap' }
        iv: { type: string, description: Base64(12B) }
        ciphertext: { type: string }
        sig: { type: string, description: Base64(64B Ed25519) }

    Conversation:
      type: object
      required: [id, groupId, type, created_at]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        type: { type: string, enum: [private, subset] }
        created_at: { type: string, format: date-time }

    Group:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        creatorId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
        createdAt: { type: string, format: date-time }

paths:
  /api/devices:
    get:
      tags: [devices]
      summary: Lister les identités d'appareil du sujet authentifié
      responses:
        "200":
          description: Registre du compte courant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountDevice' }

  /api/devices/registrations/challenge:
    post:
      tags: [devices]
      summary: Créer une transcription de preuve Ed25519 à usage unique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, identityPublicKey, platform, deviceName]
              properties:
                deviceId: { type: string, format: uuid }
                identityPublicKey: { type: string, minLength: 44, maxLength: 44 }
                platform: { type: string, enum: [android, ios, windows, macos, unknown] }
                deviceName: { type: string, minLength: 1, maxLength: 64 }
                bootstrapGrant: { type: string, minLength: 43, maxLength: 43, description: Requis si cette preuve doit réaliser le tout premier bootstrap }
      responses:
        "201":
          description: Challenge créé pour 5 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationChallenge' }
        "403": { description: Identifiant d'appareil révoqué ou grant de bootstrap invalide }
        "409": { description: Identité différente déjà liée à cet UUID d'appareil }
        "429": { description: Limite de challenges atteinte }

  /api/devices/registrations/{challengeId}/proof:
    post:
      tags: [devices]
      summary: Prouver la possession de la clé privée d'identité
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature]
              properties:
                signature: { type: string, minLength: 88, maxLength: 88, description: Base64 canonique de 64 octets Ed25519 }
      responses:
        "201":
          description: Preuve valide ; premier appareil actif, suivants en attente
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, status, bootstrap]
                properties:
                  deviceId: { type: string, format: uuid }
                  status: { type: string, enum: [pending, active] }
                  bootstrap: { type: boolean }
        "403": { description: "Signature invalide, bootstrap non autorisé ou appareil révoqué" }
        "404": { description: Challenge absent pour le sujet }
        "409": { description: Challenge consommé ou identité en conflit }
        "410": { description: Challenge expiré }

  /api/devices/{targetDeviceId}/approvals/challenge:
    post:
      tags: [devices]
      summary: Créer une décision d'approbation ou de refus à signer
      parameters:
        - in: path
          name: targetDeviceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approverDeviceId, decision]
              properties:
                approverDeviceId: { type: string, format: uuid }
                decision: { type: string, enum: [approve, reject] }
      responses:
        "201":
          description: Transcription créée pour 5 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceApprovalChallenge' }
        "403": { description: L'appareil approbateur n'est pas actif }
        "404": { description: Cible absente du compte courant }
        "409": { description: La cible n'est plus en attente }
        "429": { description: Limite de challenges atteinte }

  /api/devices/approvals/{challengeId}/decision:
    post:
      tags: [devices]
      summary: Appliquer une décision signée par l'appareil actif
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature]
              properties:
                signature: { type: string, minLength: 88, maxLength: 88, description: Base64 canonique de 64 octets Ed25519 }
      responses:
        "200":
          description: Décision appliquée atomiquement
          content:
            application/json:
              schema:
                type: object
                required: [targetDeviceId, approverDeviceId, decision, status]
                properties:
                  targetDeviceId: { type: string, format: uuid }
                  approverDeviceId: { type: string, format: uuid }
                  decision: { type: string, enum: [approve, reject] }
                  status: { type: string, enum: [active, revoked] }
        "400": { description: Encodage de signature non canonique }
        "403": { description: Signature invalide ou approbateur inactif }
        "404": { description: Challenge absent pour le compte courant }
        "409": { description: Challenge consommé ou identité/état modifié }
        "410": { description: Challenge expiré }

  /auth/register:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                username: { type: string }
      responses:
        "201": { description: Created }

  /auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [access, refresh, user]
                properties:
                  access: { type: string }
                  refresh: { type: string }
                  user: { type: object }

  /auth/refresh:
    post:
      tags: [auth]
      security:
        - refreshAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access: { type: string }

  /auth/logout:
    post:
      tags: [auth]
      security:
        - refreshAuth: []
      responses:
        "200": { description: Refresh token révoqué ou session déjà absente }
        "401": { description: Token fourni invalide ou destiné à un autre usage }

  /auth/device-bootstrap-grant:
    post:
      tags: [auth, devices]
      summary: Réautoriser par mot de passe le bootstrap du premier appareil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 1024 }
      responses:
        "201":
          description: Grant opaque valable 5 minutes, valeur brute non stockée
          content:
            application/json:
              schema:
                type: object
                required: [grant, expiresAt]
                properties:
                  grant: { type: string, minLength: 43, maxLength: 43, description: Base64URL canonique sans padding de 32 octets CSPRNG }
                  expiresAt: { type: string, format: date-time }
        "401": { description: Access token ou mot de passe invalide }
        "429": { description: Limite de réautorisations atteinte }

  /groups:
    post:
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses: { "201": { description: Created } }
    get:
      tags: [groups]
      responses:
        "200":
          description: List groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }

  /groups/{groupId}/members:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [groups]
      description: Réservé aux membres du cercle.
      responses:
        "200":
          description: Members
        "403": { description: Cercle inaccessible. }

  /groups/{groupId}/members/{memberId}/role:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: memberId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [groups]
      summary: Affecter le rôle admin ou membre (propriétaire uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        "200": { description: Rôle mis à jour. }
        "403": { description: Action interdite ou cible inaccessible. }

  /groups/{groupId}/join-requests:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [groups]
      summary: Demander à rejoindre un cercle
      responses:
        "201": { description: Demande créée. }
        "409": { description: Déjà membre ou demande en attente déjà existante. }
    get:
      tags: [groups]
      summary: Lister les demandes (propriétaire ou administrateur)
      responses:
        "200": { description: Demandes en attente. }
        "403": { description: Action interdite ou cercle inaccessible. }

  /groups/{groupId}/join-requests/{requestId}/handle:
    post:
      tags: [groups]
      summary: Accepter ou refuser une demande (propriétaire ou administrateur)
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, reject] }
      responses:
        "200": { description: Demande traitée. }
        "403": { description: Action interdite ou cible inaccessible. }

  /groups/{groupId}/join-requests/{requestId}/vote:
    post:
      tags: [groups]
      deprecated: true
      summary: Route héritée neutralisée, aucun vote collectif en V1
      responses:
        "403": { description: Toujours refusé. }

  /keys/group/{groupId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [keys]
      summary: Répertoire des clés actives du cercle, réservé aux membres
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceKey' }
        "403": { description: Cercle inaccessible. }

  /keys/group/{groupId}/my-devices:
    get:
      tags: [keys]
      summary: Lister ses appareils actifs et révoqués dans un cercle membre
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "403": { description: Cercle inaccessible. }

  /keys/group/{groupId}/devices:
    post:
      tags: [keys]
      summary: Publier ses propres clés d'appareil dans un cercle membre
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, pk_sig, pk_kem, key_version]
              properties:
                deviceId: { type: string }
                pk_sig: { type: string }
                pk_kem: { type: string }
                key_version: { type: integer }
      responses:
        "201": { description: Created }
        "403": { description: Cercle inaccessible ou appareil révoqué. }

  /keys/group/{groupId}/devices/{deviceId}:
    delete:
      tags: [keys]
      summary: Révoquer l'un de ses propres appareils dans un cercle membre
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "403": { description: Cercle inaccessible. }

  /conversations:
    post:
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, type, memberIds]
              properties:
                groupId: { type: string, format: uuid }
                type: { type: string, enum: [private, subset] }
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201": { description: Created }
        "403": { description: Acteur ou participant extérieur au cercle. }
    get:
      tags: [conversations]
      responses: { "200": { description: List } }

  /conversations/{conversationId}/messages:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: cursor
        schema: { type: string }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      tags: [messages]
      responses:
        "200":
          description: Page de messages v2
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MessageV2' }
                  nextCursor: { type: string, nullable: true }

  /messages:
    post:
      tags: [messages]
      summary: Envoi d’un message v2 (X25519 + Ed25519)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageV2' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "403":
          description: Expéditeur divergent du sujet authentifié ou ACL refusée.
