server {
  listen 8080;
  server_name _;

  server_tokens off;
  client_max_body_size 256k;

  add_header X-Trust-Circle-Environment "staging" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"environment":"staging"}';
  }

  location = /health/auth {
    access_log off;
    proxy_pass http://auth:3000/health;
  }

  location = /health/messaging {
    access_log off;
    proxy_pass http://messaging:3001/health;
  }

  location /auth/ {
    proxy_pass http://auth:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://messaging:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket {
    proxy_pass http://messaging:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
  }

  location / {
    default_type application/json;
    return 404 '{"error":"not_found","environment":"staging"}';
  }
}
